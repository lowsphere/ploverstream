// ---- status: a socket of its own to the server, for ping and memory
// It signs in with the token in "status" mode, which never starts a session.
const PING_EVERY = 5000;
const net = { ws: null, up: false, rtt: null, mem: null, sentAt: 0, timer: 0, retry: 0, backoff: 2000, refused: false };
const hasServer = BUILT && !!CFG.server && !!CFG.token;

function statusConnect() {
  if (!hasServer || net.ws || net.refused) return;
  clearTimeout(net.retry);
  let sock;
  try { sock = new WebSocket(CFG.server); } catch (_) { return; }
  net.ws = sock;
  sock.binaryType = "arraybuffer";
  sock.onopen = () => sock.send(JSON.stringify({ t: "auth", proto: 1, mode: "status", token: CFG.token, client: { device: "Web OS status" } }));
  sock.onmessage = (e) => {
    if (net.ws !== sock) return;
    let m = null;
    try {
      const b = typeof e.data === "string" ? null : new Uint8Array(e.data);
      m = b ? (b[0] === 0 ? JSON.parse(new TextDecoder().decode(b.subarray(1))) : null) : JSON.parse(e.data);
    } catch (_) {}
    if (!m) return;
    if (m.t === "status.ready") {
      net.up = true; net.backoff = 2000;
      clearInterval(net.timer);
      net.timer = setInterval(statusPing, PING_EVERY);
      statusPing();
    } else if (m.t === "pong") {
      if (net.sentAt) net.rtt = performance.now() - net.sentAt;
      net.sentAt = 0;
      if (m.mem && m.mem.total > 0) net.mem = { total: +m.mem.total, used: +m.mem.used };
    } else return;
    syncNet(); syncRam();
  };
  sock.onclose = (e) => {
    if (net.ws !== sock) return;
    net.ws = null; net.up = false; net.rtt = null; net.sentAt = 0;
    clearInterval(net.timer);
    syncNet(); syncRam();
    if (e.code === 4401) { net.refused = true; return; }
    net.retry = setTimeout(statusConnect, net.backoff);
    net.backoff = Math.min(net.backoff * 2, 60000);
  };
}
// A ping unanswered for 15 seconds means the connection is gone.
function statusPing() {
  if (!net.up) return;
  if (net.sentAt) { if (performance.now() - net.sentAt > 15000) net.ws.close(); return; }
  net.sentAt = performance.now();
  net.ws.send(JSON.stringify({ t: "ping", ts: Date.now() }));
}
addEventListener("online", () => { net.backoff = 2000; statusConnect(); syncNet(); });

const GB = 1073741824;
const fmtGB = (n) => (n / GB).toFixed(n < 10 * GB ? 1 : 0) + " GB";
const pingClass = (ms) => (ms == null ? "" : ms < 80 ? "good" : ms < 200 ? "ok" : "bad");
const pingWord = (ms) => (ms == null ? "" : ms < 80 ? "Good" : ms < 200 ? "Fair" : "Slow");

const netBtn = $("#tb-net");

  netBtn.setAttribute("aria-label", netBtn.title);

}

  const m = net.mem;

  const pct = Math.round(m.used / m.total * 100);
  ramEl.innerHTML = ic("ram", 16, 2) + pct + "%";

// Clicking the wifi icon shows the round trip to the server, kept fresh by
// the pings above while it is open.
function openNetPop() {
  closeMenus(); closeStart();
  const m = html('<div class="menu panel net-pop" role="dialog" aria-label="Connection"></div>');
  $("#desktop").append(m);

  m.style.left = clamp(r.right - w, 8, innerWidth - w - 8) + "px";

}
function paintNetPop() {
  const m = openMenu && openMenu.anchor === netBtn ? openMenu.el : null;
  if (!m) return;
  let head, dot = "";
  if (!navigator.onLine) head = "Offline";
  else if (!hasServer) head = "No server: this desktop is a preview";
  else if (net.refused) head = "The server refused this desktop’s token";
  else if (!net.up) head = "Connecting to " + CFG.name + "…";
  else { head = "Connected to " + CFG.name; dot = pingClass(net.rtt); }
  const rtt = net.up && net.rtt != null ? Math.round(net.rtt) : null;
  let out = '<div class="np-head"><i class="np-dot ' + dot + '"></i><span></span></div>' +
    '<div class="np-ping">' + (rtt == null ? "—" : rtt < 1 ? "&lt;1" : rtt) + "<small>ms ping" + (rtt == null ? "" : " · " + pingWord(rtt)) + "</small></div>";
  if (net.mem) {
    const pct = Math.round(net.mem.used / net.mem.total * 100);
    out += '<div class="np-row"><span>Server memory</span><b>' + fmtGB(net.mem.used) + " / " + fmtGB(net.mem.total) + " · " + pct + "%</b></div>" +
      '<div class="np-bar"><i style="width:' + pct + '%"></i></div>';
  }
  if (hasServer) {
    let host = "";
    try { host = new URL(CFG.server).host; } catch (_) {}
    if (host) out += '<div class="np-row"><span>Server</span><b class="np-host"></b></div>';
    m.innerHTML = out;
    if (host) $(".np-host", m).textContent = host;
  } else m.innerHTML = out;
  $(".np-head span", m).textContent = head;
}
netBtn.addEventListener("click", () => (openMenu && openMenu.anchor === netBtn ? closeMenus() : openNetPop()));

const ck = { day: $(".ck-day"), ampm: $(".ck-ampm"), time: $(".ck-time"), date: $(".ck-date") };
function tick() {
  const d = new Date(), h = d.getHours();
  const set = (el, v) => { if (el.textContent !== v) el.textContent = v; };
  set(ck.day, d.toLocaleDateString([], { weekday: "long" }));
  set(ck.ampm, h < 12 ? "AM" : "PM");
  set(ck.time, (h % 12 || 12) + ":" + String(d.getMinutes()).padStart(2, "0"));
  set(ck.date, d.toLocaleDateString());
}

// ================================================================ dock and start
const dockApps = $("#dock-apps"), startEl = $("#start"), startBtn = $("#start-btn"), searchBtn = $("#search-btn"), smQ = $("#sm-q");
startBtn.innerHTML = ic("grid", 18, 2) + "<span>Start</span>";
searchBtn.innerHTML = ic("search", 17, 2) + '<span class="s-lbl">Search</span><span class="s-caret"></span><kbd>Ctrl K</kbd>';
$("#sm-ic").outerHTML = ic("search", 16, 2);
$("#sm-server").textContent = CFG.name;
dockApps.innerHTML = APP_ORDER.map((a) => '<button class="dk" data-app="' + a + '" title="' + esc(APPS[a].name) + '" aria-label="' + esc(APPS[a].name) + '">' +
  ic(APPS[a].icon, 22) + '<i class="dk-dot"></i></button>').join("");

// One click on an app: open it, bring it forward, or tuck it away when it is
// already in front.
dockApps.addEventListener("click", (e) => {
  const b = e.target.closest(".dk");
  if (!b) return;
  const mine = [...wins.values()].filter((w) => w.app === b.dataset.app).sort((x, y) => x.el.style.zIndex - y.el.style.zIndex);
  if (!mine.length) return APPS[b.dataset.app].open();
  const top = mine[mine.length - 1];
  if (top === focused && !top.min) top.minimize();
  else focusWin(mine.filter((w) => !w.min).pop() || top);
});

function syncChrome() {
  for (const b of $$(".dk", dockApps)) {
    const open = [...wins.values()].some((w) => w.app === b.dataset.app);
    b.classList.toggle("open", open);
  }
  $("#tb-app").textContent = focused ? APPS[focused.app].name : "Desktop";
  syncFullWin();
  syncBars();
}

let hot = 0, results = [];
function openStart() {
  closeMenus();
  startEl.hidden = false;
  startBtn.classList.add("on");
  smQ.value = "";
  renderStart();
  smQ.focus();
}
function closeStart() {
  if (startEl.hidden) return;
  startEl.hidden = true;
  startBtn.classList.remove("on");
  if (document.body.classList.contains("hidebars")) hideBars();
}
function row(r, i) {
  return '<button class="sm-row' + (i === hot ? " hot" : "") + '" data-i="' + i + '">' + ic(r.icon, 18) +
    '<span class="sm-txt"><span class="sm-name">' + esc(r.name) + "</span>" + (r.sub ? '<span class="sm-path">' + esc(r.sub) + "</span>" : "") + "</span></button>";
}
function renderStart() {
  const q = smQ.value.trim().toLowerCase();
  const appsEl = $("#sm-apps"), listEl = $("#sm-list");
  hot = 0;
  if (!q) {
    $("#sm-apps-lbl").hidden = appsEl.hidden = false;
    $("#sm-list-lbl").textContent = "Recent";
    appsEl.innerHTML = APP_ORDER.map((a) => '<button class="sm-app" data-app="' + a + '"><span class="tile">' + ic(APPS[a].icon, 20) + "</span>" + esc(APPS[a].name) + "</button>").join("");
    results = state.recent.filter(isFile).slice(0, 6).map((p) => ({ name: basename(p), sub: dirname(p), icon: "file", path: p }));
    hot = -1;
    listEl.innerHTML = results.length ? results.map(row).join("") : '<div class="sm-none">Files you open show up here.</div>';
    return;
  }
  $("#sm-apps-lbl").hidden = appsEl.hidden = true;
  $("#sm-list-lbl").textContent = "Results";
  results = APP_ORDER.filter((a) => APPS[a].name.toLowerCase().includes(q)).map((a) => ({ name: APPS[a].name, sub: "App", icon: APPS[a].icon, app: a }))
    .concat(walk().filter((e) => e.name.toLowerCase().includes(q)).slice(0, 12)
      .map((e) => ({ name: e.name, sub: dirname(e.path), icon: e.node.t === "d" ? "folder" : "file", path: e.path })));
  listEl.innerHTML = results.length ? results.map(row).join("") : '<div class="sm-none">Nothing matches “' + esc(smQ.value.trim()) + "”.</div>";
}
function launch(r) {
  closeStart();
  if (r.app) APPS[r.app].open();
  else openPath(r.path);
}
startBtn.addEventListener("click", () => (startEl.hidden ? openStart() : closeStart()));
searchBtn.addEventListener("click", () => (startEl.hidden ? openStart() : closeStart()));
smQ.addEventListener("input", renderStart);
smQ.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && results.length) { e.preventDefault(); launch(results[Math.max(0, hot)]); }
  else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && results.length) {
    e.preventDefault();
    hot = (Math.max(hot, e.key === "ArrowDown" ? -1 : 0) + (e.key === "ArrowDown" ? 1 : -1) + results.length) % results.length;
    $$(".sm-row", startEl).forEach((r, i) => r.classList.toggle("hot", i === hot));
  }
});
startEl.addEventListener("click", (e) => {
  const a = e.target.closest(".sm-app");
  if (a) { closeStart(); APPS[a.dataset.app].open(); return; }
  const r = e.target.closest(".sm-row");
  if (r) launch(results[+r.dataset.i]);
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && fsInTab) { leaveFull(); return; }
  if (e.key === "Escape") { if (openMenu) { closeMenus(); e.preventDefault(); } else if (!startEl.hidden) { closeStart(); startBtn.focus(); } }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if (startEl.hidden) openStart(); else closeStart();
  }
});

// ================================================================ start up
document.title = CFG.name + " · Plover";
applyLook();
applyWallpaper();
statusConnect();
syncNet(); syncFull(); tick();
setInterval(tick, 1000);
fsWatchers.add(renderDesktop);
renderDesktop();
syncChrome();
if (!storageOk) toast("This browser isn't letting the desktop save, so files last only until the page closes.");
})();
</script>
</body>
</html>
