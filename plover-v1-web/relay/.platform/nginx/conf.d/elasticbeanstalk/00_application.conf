# Replaces the platform's default `location /` so the proxy to the Node app on
# 127.0.0.1:8080 passes the WebSocket Upgrade/Connection headers and holds the
# connection open. This file overrides the stock one of the same path on the
# Amazon Linux 2 / 2023 Node.js platform.
location / {
    proxy_pass          http://127.0.0.1:8080;
    proxy_http_version  1.1;

    proxy_set_header    Connection          $connection_upgrade;
    proxy_set_header    Upgrade             $http_upgrade;
    proxy_set_header    Host                $host;
    proxy_set_header    X-Real-IP           $remote_addr;
    proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto   $scheme;

    # Pixel streaming is long-lived and can go quiet between frames; don't let
    # nginx time the socket out.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;
}
