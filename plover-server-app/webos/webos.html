<!doctype html>
<html lang="en" data-style="glassmorphic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src __PLOVER_CONNECT__; img-src blob: data:; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Plover</title>
<link id="favicon" rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<!--
  Plover Web OS: a desktop in one file. Plover Server builds it per server from
  this template (main.js, buildWebOsHtml): it fills in the server's look and
  the per-server client.html, which runs unchanged as the Browser app in
  an iframe written from CLIENT_HTML. A srcdoc frame inherits this page's CSP on
  top of its own, so connect-src above names the same stream the client does.

  Apps: Browser (the Plover client), Files, Text Editor, Terminal and Settings,
  plus any single-file HTML apps installed in Plover Server (CFG.apps), each in
  a sandboxed frame (see "installed apps" below).
  Files are kept in localStorage under "plover-os:<server id>", in this browser
  only. Terminal signs in to the server's shell with the token and a password
  the user types (server.js, lib/terminal.js); the password is never stored.
  The look (html[data-style], --accent) starts from the server's choice and can
  be changed in Settings; that choice is kept with the files.

  The fonts come from Google Fonts. Everything else is in this file; without
  network the desktop falls back to system fonts.
-->
<style>
:root{
  --accent:#3d6b26; --accent-ink:#ffffff;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  --display:var(--font);
  --dock-h:80px; --bar-h:48px; --bar-radius:999px;
}

/* ================================================================ styles
   Each style sets the same tokens:
     --p-*  panels (top bar, clock, dock, desktop tiles)
     --win-bg  windows, menus and dialogs, which can sit over a white page
     --w-*  wells (lists, text areas, inputs)       --b-*  buttons
     --hover / --sel  row states    --ic  file icons    --shade  text shadow  */
[data-style="glassmorphic"]{
  --font:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --text:#ffffff; --muted:rgba(255,255,255,.8); --faint:rgba(255,255,255,.58);
  --desk:
    radial-gradient(70% 60% at 82% 10%,color-mix(in srgb,var(--accent) 55%,#fff) 0%,transparent 70%),
    radial-gradient(60% 70% at 8% 96%,color-mix(in srgb,var(--accent) 55%,#000) 0%,transparent 70%),
    color-mix(in srgb,var(--accent) 88%,#000);
  --p-bg:rgba(255,255,255,.12); --p-border:1.5px solid rgba(255,255,255,.55);
  --p-shadow:inset 0 0 18px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.45),0 20px 44px rgba(0,0,0,.24);
  --p-filter:blur(22px) saturate(130%); --p-radius:26px; --m-radius:18px;
  --win-bg:color-mix(in srgb,color-mix(in srgb,var(--accent) 55%,#000) 64%,transparent);
  --w-bg:rgba(255,255,255,.07); --w-border:1px solid rgba(255,255,255,.36); --w-shadow:inset 0 0 12px rgba(255,255,255,.12); --w-radius:16px;
  --b-bg:rgba(255,255,255,.1); --b-border:1px solid rgba(255,255,255,.45); --b-shadow:inset 0 0 10px rgba(255,255,255,.14); --b-radius:999px;
  --hover:rgba(255,255,255,.13); --sel:rgba(255,255,255,.24); --ic:#ffffff;
  --shade:0 1px 2px rgba(0,0,0,.28);
  color-scheme:dark;
}
/* A pale accent makes a pale wallpaper: dark text, milkier glass. */
[data-style="glassmorphic"][data-tone="light"]{
  --text:color-mix(in srgb,var(--accent) 18%,#151515); --muted:color-mix(in srgb,var(--text) 78%,transparent); --faint:color-mix(in srgb,var(--text) 55%,transparent);
  --p-bg:rgba(255,255,255,.3); --win-bg:rgba(255,255,255,.66);
  --w-bg:rgba(255,255,255,.35); --b-bg:rgba(255,255,255,.4);
  --hover:rgba(0,0,0,.06); --sel:rgba(0,0,0,.11); --ic:var(--text); --shade:none;
  color-scheme:light;
}
[data-style="neumorphic"]{
  --font:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --base:color-mix(in srgb,var(--accent) 7%,#e6eae4);
  --dark:color-mix(in srgb,var(--base) 80%,#000);
  --text:color-mix(in srgb,var(--accent) 22%,#262b24); --muted:color-mix(in srgb,var(--text) 78%,var(--base)); --faint:color-mix(in srgb,var(--text) 52%,var(--base));
  --deep:color-mix(in srgb,var(--accent) 80%,#000);
  --raised:8px 8px 16px var(--dark),-8px -8px 16px #fff;
  --raised-sm:4px 4px 8px var(--dark),-4px -4px 8px #fff;
  --inset:inset 4px 4px 8px var(--dark),inset -4px -4px 8px #fff;
  --desk:var(--base);
  --p-bg:var(--base); --p-border:0 solid transparent; --p-shadow:var(--raised); --p-filter:none; --p-radius:26px; --m-radius:18px;
  --win-bg:var(--base);
  --w-bg:var(--base); --w-border:0 solid transparent; --w-shadow:var(--inset); --w-radius:18px;
  --b-bg:var(--base); --b-border:0 solid transparent; --b-shadow:var(--raised-sm); --b-radius:14px;
  --hover:color-mix(in srgb,var(--base) 93%,#000); --sel:color-mix(in srgb,var(--accent) 18%,var(--base)); --ic:var(--deep);
  --shade:none;
  color-scheme:light;
}
[data-style="brutalist"]{
  --font:"IBM Plex Mono",ui-monospace,Consolas,monospace; --mono:var(--font);
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --text:#000; --muted:#333; --faint:#666;
  --desk:#efece3;
  --p-bg:#fff; --p-border:3px solid #000; --p-shadow:6px 6px 0 #000; --p-filter:none; --p-radius:0px; --m-radius:0px;
  --win-bg:#fff;
  --w-bg:#fff; --w-border:2px solid #000; --w-shadow:none; --w-radius:0px;
  --b-bg:#fff; --b-border:2px solid #000; --b-shadow:3px 3px 0 #000; --b-radius:0px;
  --hover:#f1eee4; --sel:var(--accent); --ic:#000;
  --shade:none; --dock-h:72px; --bar-radius:0px;
  color-scheme:light;
}
[data-style="sleek"]{
  --font:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --text:#f3f4f6; --muted:#9ca0a8; --faint:#6b7079;
  --desk:#0a0b0d;
  --p-bg:linear-gradient(180deg,#17181c 0%,#121316 100%); --p-border:1px solid rgba(255,255,255,.08);
  --p-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 16px 40px rgba(0,0,0,.5); --p-filter:none; --p-radius:14px; --m-radius:10px;
  --win-bg:var(--p-bg);
  --w-bg:rgba(0,0,0,.28); --w-border:1px solid rgba(255,255,255,.08); --w-shadow:none; --w-radius:10px;
  --b-bg:rgba(255,255,255,.05); --b-border:1px solid rgba(255,255,255,.08); --b-shadow:none; --b-radius:8px;
  --hover:rgba(255,255,255,.06); --sel:color-mix(in srgb,var(--accent) 20%,transparent); --ic:var(--accent);
  --shade:none; --dock-h:68px; --bar-h:44px; --bar-radius:var(--p-radius);
  color-scheme:dark;
}

/* ================================================================ base */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{font:13px/1.45 var(--font);color:var(--text);background:#000;-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font:inherit;color:inherit}
svg{display:block;flex:none}
[data-style="brutalist"] .ic{stroke-linecap:square;stroke-linejoin:miter;stroke-width:2.25px}
::selection{background:color-mix(in srgb,var(--accent) 45%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[data-style="glassmorphic"] :focus-visible{outline-color:#fff}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
kbd{font:500 10px/1 var(--mono)}

#desktop{position:fixed;inset:0;overflow:hidden;background:var(--desk)}
.wp{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wp > *{display:none;position:absolute}
[data-style="brutalist"] .wp-type{display:block;left:clamp(40px,14vw,220px);top:clamp(120px,24vh,260px);font:400 clamp(150px,26vw,420px)/.82 var(--display);
  letter-spacing:-.04em;color:transparent;-webkit-text-stroke:2px #000;opacity:.12;white-space:pre-line}
[data-style="sleek"] .wp-grid{display:block;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px}
[data-style="sleek"] .wp-glow{display:block;right:-12vw;bottom:-22vh;width:65vw;height:65vw;max-width:900px;max-height:900px;border-radius:50%;background:var(--accent);filter:blur(140px);opacity:.12}

/* ---- shared surfaces ---- */
.panel{background:var(--p-bg);border:var(--p-border);box-shadow:var(--p-shadow);border-radius:var(--p-radius);
  -webkit-backdrop-filter:var(--p-filter);backdrop-filter:var(--p-filter);color:var(--text);text-shadow:var(--shade)}
.win.panel,.menu.panel,.dialog.panel,.start-menu.panel,.toast.panel{background:var(--win-bg)}
.well{background:var(--w-bg);border:var(--w-border);box-shadow:var(--w-shadow);border-radius:var(--w-radius)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;flex:none;cursor:pointer;white-space:nowrap;
  font-size:12.5px;font-weight:500;color:var(--text);text-shadow:inherit;
  background:var(--b-bg);border:var(--b-border);box-shadow:var(--b-shadow);border-radius:var(--b-radius);transition:background .12s,box-shadow .12s,transform .06s}
.btn:hover{background:var(--hover)}
.btn.icon{width:32px;padding:0}
.btn.primary{background:var(--accent);color:var(--accent-ink);text-shadow:none}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:#e5484d}
.btn.primary.danger{background:#e5484d;color:#fff}
.btn:disabled{opacity:.45;cursor:default;filter:none}
[data-style="glassmorphic"] .btn.danger:not(.primary){color:#ffd4d4}
[data-style="glassmorphic"][data-tone="light"] .btn.danger:not(.primary){color:#c62828}
[data-style="glassmorphic"] .btn.primary{border-color:rgba(255,255,255,.7)}
[data-style="neumorphic"] .btn:active:not(:disabled){box-shadow:var(--inset)}
[data-style="neumorphic"] .btn.primary{box-shadow:var(--raised-sm)}
[data-style="brutalist"] .btn{text-transform:uppercase;font-weight:700;font-size:11.5px}
[data-style="brutalist"] .btn:hover:not(:disabled){background:var(--accent);color:var(--accent-ink)}
[data-style="brutalist"] .btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
[data-style="brutalist"] .btn.primary{border-color:#000}
.inp{display:block;width:100%;height:36px;padding:0 12px;outline:none;user-select:text;color:var(--text);text-shadow:none;
  background:var(--w-bg);border:var(--w-border);box-shadow:var(--w-shadow);border-radius:min(var(--w-radius),12px)}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.inp::placeholder{color:var(--faint)}
input[type=checkbox]{accent-color:var(--accent);margin:0}
.check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}

/* ================================================================ top bar */
.topbar{position:absolute;left:16px;top:16px;z-index:20;width:min(560px,calc(100% - 300px));height:var(--bar-h);
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 0 18px;border-radius:var(--bar-radius)}
.tb-left{display:flex;align-items:center;gap:2px;min-width:0;font-size:13px;font-weight:500}
.tb-logo{width:18px;height:18px;flex:none;border-radius:50%;margin-right:10px}
.tb-app{font-weight:600;margin-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.tb-menu{border:0;background:transparent;padding:5px 9px;border-radius:999px;cursor:pointer;color:var(--muted);text-shadow:inherit}
.tb-menu:hover,.tb-menu.open{background:var(--hover);color:var(--text)}
.tb-right{display:flex;align-items:center;gap:4px;flex:none}
.tb-ic{width:34px;height:34px;display:grid;place-items:center;border:0;padding:0;background:transparent;border-radius:999px;color:inherit;cursor:pointer}
button.tb-ic:hover{background:var(--hover)}
span.tb-ic{cursor:default}
.tb-ram{height:32px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:500;
  background:var(--b-bg);border:var(--b-border);box-shadow:var(--b-shadow)}
[data-style="glassmorphic"] .tb-logo{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 5%,#fff),color-mix(in srgb,var(--accent) 22%,#fff));box-shadow:0 0 10px rgba(255,255,255,.6)}
[data-style="neumorphic"] .topbar{padding:0 7px 0 18px}
[data-style="neumorphic"] .tb-logo{background:var(--accent);box-shadow:var(--raised-sm)}
[data-style="neumorphic"] .tb-ram{box-shadow:var(--inset)}
[data-style="brutalist"] .topbar{padding:0;align-items:stretch;gap:0}
[data-style="brutalist"] .tb-left{align-items:stretch;gap:0;font-weight:700;text-transform:uppercase}
[data-style="brutalist"] .tb-logo{width:44px;height:auto;margin:0;border-radius:0;background:var(--accent);border-right:3px solid #000;display:grid;place-items:center}
[data-style="brutalist"] .tb-logo::after{content:"";width:14px;height:14px;background:#000}
[data-style="brutalist"] .tb-app{display:flex;align-items:center;margin:0;padding:0 14px;border-right:3px solid #000;font:400 13px var(--display);letter-spacing:.02em;max-width:none}
[data-style="brutalist"] .tb-menu{border-radius:0;padding:0 12px;color:#000;text-transform:uppercase;font-weight:700}
[data-style="brutalist"] .tb-menu:hover,[data-style="brutalist"] .tb-menu.open{background:var(--accent);color:var(--accent-ink)}
[data-style="brutalist"] .tb-right{align-items:stretch;gap:0}
[data-style="brutalist"] .tb-ic{width:44px;height:auto;border-radius:0;border-left:3px solid #000}
[data-style="brutalist"] button.tb-ic:hover{background:var(--accent)}
[data-style="brutalist"] .tb-ram{height:auto;border:0;border-left:3px solid #000;border-radius:0;box-shadow:none;background:#000;color:#fff;font-weight:700;font-size:13px}
[data-style="brutalist"] .tb-ram svg{display:none}
[data-style="brutalist"] .tb-ram::before{content:"RAM"}
[data-style="sleek"] .topbar{padding:0 6px 0 16px}
[data-style="sleek"] .tb-logo{width:14px;height:14px;border-radius:4px;background:var(--accent)}
[data-style="sleek"] .tb-menu,[data-style="sleek"] .tb-ic{border-radius:8px}
[data-style="sleek"] .tb-ic{width:32px;height:32px;color:#c9ccd2}
[data-style="sleek"] .tb-ram{height:30px;border-radius:8px;padding:0 10px;font-family:var(--mono);color:#c9ccd2}
.tb-ram{font-variant-numeric:tabular-nums}
#tb-net.open{background:var(--hover)}
[data-style="brutalist"] #tb-net.open{background:var(--accent)}

/* The wifi icon's popover: the round trip to the server, and its memory. */
.net-pop{min-width:240px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:default}
.np-head{display:flex;align-items:center;gap:8px;font-weight:600}
.np-dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--faint)}
.np-dot.good{background:#3fb950}.np-dot.ok{background:#d29922}.np-dot.bad{background:#e5484d}
[data-style="brutalist"] .np-dot{border-radius:0}
.np-ping{font-size:30px;line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.np-ping small{font-size:13px;letter-spacing:0;color:var(--muted);margin-left:4px}
[data-style="brutalist"] .np-ping{font:400 34px/1 var(--display)}
.np-row{display:flex;justify-content:space-between;gap:16px;font-size:12px;color:var(--muted)}
.np-row b{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.np-bar{height:6px;border-radius:99px;overflow:hidden;background:color-mix(in srgb,currentColor 14%,transparent)}
.np-bar i{display:block;height:100%;background:var(--accent)}
[data-style="brutalist"] .np-bar{border-radius:0;border:2px solid #000;height:10px}

/* ================================================================ clock */
.clock{position:absolute;right:16px;top:16px;z-index:1;width:252px;padding:6px}
.ck-in{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.ck-head{display:flex;align-items:center;justify-content:space-between}
.ck-day{font-size:13px;font-weight:600}
.ck-ampm{height:22px;display:flex;align-items:center;gap:6px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:500;
  background:var(--b-bg);border:var(--b-border);box-shadow:var(--b-shadow)}
.ck-time{font-size:50px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ck-rule{display:none}
.ck-date{font-size:12px;color:var(--muted)}
[data-style="glassmorphic"] .ck-in{border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 0 12px rgba(255,255,255,.12)}
[data-style="neumorphic"] .clock{padding:8px}
[data-style="neumorphic"] .ck-in{border-radius:20px;box-shadow:var(--inset)}
[data-style="neumorphic"] .ck-ampm{color:var(--deep);font-weight:600}
[data-style="brutalist"] .clock{padding:0}
[data-style="brutalist"] .ck-in{padding:0;gap:0}
[data-style="brutalist"] .ck-head{height:34px;padding:0 12px;background:#000;color:#fff;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
[data-style="brutalist"] .ck-day{font-weight:700}
[data-style="brutalist"] .ck-ampm{height:auto;padding:2px 6px;border:0;border-radius:0;box-shadow:none;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700}
[data-style="brutalist"] .ck-time{padding:12px 12px 6px;font:400 68px/.9 var(--display)}
[data-style="brutalist"] .ck-date{margin-top:6px;padding:8px 12px;border-top:3px solid #000;color:#000;font-size:13px;font-weight:500}
[data-style="sleek"] .clock{padding:16px 18px}
[data-style="sleek"] .ck-in{padding:0;gap:12px}
[data-style="sleek"] .ck-day{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
[data-style="sleek"] .ck-ampm{height:auto;padding:0;border:0;background:none;box-shadow:none;font:500 11px var(--mono);color:var(--muted)}
[data-style="sleek"] .ck-ampm::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
[data-style="sleek"] .ck-time{font-size:54px;font-weight:300;letter-spacing:-.05em}
[data-style="sleek"] .ck-rule{display:block;height:1px;background:rgba(255,255,255,.08)}
[data-style="sleek"] .ck-date{font:400 12px var(--mono)}

/* ================================================================ desktop icons */
/* Icons sit where they were put (renderDesktop); the grid is 96 x 108. */
#icons{position:absolute;left:16px;right:16px;top:calc(var(--bar-h) + 30px);bottom:calc(var(--dock-h) + 36px);z-index:2}
.d-icon{position:absolute;width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;border-radius:12px;cursor:default;
  font-size:12px;font-weight:500;color:var(--text);text-shadow:var(--shade);outline-offset:0}
.d-icon .tile{width:58px;height:58px;display:grid;place-items:center;border-radius:18px;color:var(--text);
  background:var(--p-bg);border:var(--p-border);box-shadow:var(--tile-shadow,var(--p-shadow));-webkit-backdrop-filter:var(--p-filter);backdrop-filter:var(--p-filter)}
.d-icon .lbl{max-width:84px;padding:1px 5px;border-radius:5px;text-align:center;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.d-icon.sel .lbl{background:var(--accent);color:var(--accent-ink);text-shadow:none}
.d-icon.drop .tile{outline:2px dashed var(--accent);outline-offset:3px}
.d-icon.moving{opacity:.4}
.d-spot{position:absolute;width:84px;height:100px;border-radius:14px;pointer-events:none;
  border:2px dashed color-mix(in srgb,var(--text) 55%,transparent);background:color-mix(in srgb,var(--text) 8%,transparent)}
[data-wp] .d-spot{border-color:rgba(255,255,255,.75);background:rgba(255,255,255,.12)}
[data-style="brutalist"] .d-spot{border-radius:0;border:3px dashed #000}
[data-style="glassmorphic"] .d-icon{--tile-shadow:inset 0 0 14px rgba(255,255,255,.2),inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px rgba(0,0,0,.2);text-shadow:0 1px 3px rgba(0,0,0,.45)}
[data-style="glassmorphic"][data-tone="light"] .d-icon{text-shadow:none}
[data-style="glassmorphic"] .d-icon.sel .lbl{background:rgba(255,255,255,.9);color:#16210f}
[data-style="neumorphic"] .d-icon{gap:8px}
[data-style="brutalist"] .d-icon{align-items:flex-start;gap:0;font-size:11px;font-weight:700;text-transform:uppercase;border-radius:0}
[data-style="brutalist"] .d-icon .tile{width:60px;height:56px;border-radius:0;--tile-shadow:4px 4px 0 #000}
[data-style="brutalist"] .d-icon .lbl{margin-top:8px;border-radius:0;background:#000;color:#fff;text-align:left;padding:1px 4px}
[data-style="brutalist"] .d-icon.sel .lbl{background:var(--accent);color:var(--accent-ink)}
[data-style="sleek"] .d-icon .tile{width:54px;height:54px;border-radius:var(--p-radius);background:linear-gradient(180deg,#1a1b20 0%,#131417 100%);
  border-color:rgba(255,255,255,.09);--tile-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 20px rgba(0,0,0,.45)}
[data-style="sleek"] .d-icon .lbl{color:#c9ccd2}
[data-style="sleek"] .d-icon.sel .lbl{color:var(--accent-ink)}

/* ================================================================ dock */
.dock{position:absolute;left:16px;bottom:16px;z-index:20;min-width:min(560px,calc(100% - 32px));max-width:calc(100% - 32px);height:var(--dock-h);
  display:flex;align-items:center;gap:8px;padding:0 10px}
/* Installed apps can make the row longer than the screen; it scrolls then. */
#dock-apps{display:flex;align-items:center;align-self:stretch;gap:inherit;min-width:0;overflow-x:auto;scrollbar-width:none;padding-inline:6px;margin-inline:-6px}
[data-style="brutalist"] #dock-apps{align-items:stretch;padding-inline:0;margin-inline:0}
#dock-apps::-webkit-scrollbar{display:none}
.ic{flex:none}
img.ic{object-fit:contain;border-radius:22%}
.start{flex:none;height:60px;width:92px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;
  border-radius:20px;font-size:14px;font-weight:600;padding:0}
.dk-sep{display:none}
.dk{position:relative;flex:none;width:52px;height:60px;display:grid;place-items:center;padding:0;cursor:pointer;border-radius:18px;color:var(--text);
  border:1px solid transparent;background:transparent}
.dk-dot{position:absolute;left:50%;bottom:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;display:none}
.dk.open .dk-dot{display:block}
.search{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0;cursor:pointer;border-radius:999px;
  color:var(--text);background:var(--b-bg);border:var(--b-border);box-shadow:var(--b-shadow);text-shadow:inherit}
.search .s-lbl,.search kbd,.search .s-caret{display:none}
[data-style="glassmorphic"] .start{border:1.5px solid rgba(255,255,255,.85);text-shadow:none;color:color-mix(in srgb,var(--accent) 55%,#000);
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 4%,rgba(255,255,255,.95)) 0%,color-mix(in srgb,var(--accent) 22%,rgba(255,255,255,.84)) 100%);
  box-shadow:inset 0 0 20px rgba(255,255,255,.75),0 10px 28px rgba(255,255,255,.2)}
[data-style="glassmorphic"] .dk{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.07);box-shadow:inset 0 0 12px rgba(255,255,255,.14)}
[data-style="glassmorphic"] .dk:hover,[data-style="glassmorphic"] .search:hover{background:rgba(255,255,255,.17)}
[data-style="neumorphic"] .dock{gap:12px;padding:0 12px}
[data-style="neumorphic"] .start{height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--raised-sm)}
[data-style="neumorphic"] .start.on{box-shadow:inset 3px 3px 6px color-mix(in srgb,var(--accent) 60%,#000),inset -3px -3px 6px color-mix(in srgb,var(--accent) 70%,#fff)}
[data-style="neumorphic"] .dk{height:56px;background:var(--base);box-shadow:var(--raised-sm)}
[data-style="neumorphic"] .dk.open{box-shadow:var(--inset);color:var(--deep)}
[data-style="neumorphic"] .dk-dot{background:var(--accent)}
[data-style="neumorphic"] .search:active{box-shadow:var(--inset)}
[data-style="brutalist"] .dock{padding:0;gap:0;align-items:stretch}
[data-style="brutalist"] .start{height:auto;width:auto;padding:0 18px;gap:10px;border-radius:0;border-right:3px solid #000;background:var(--accent);color:var(--accent-ink);
  font:400 18px var(--display);text-transform:uppercase;letter-spacing:.02em}
[data-style="brutalist"] .start .ic rect{fill:currentColor}
[data-style="brutalist"] .start.on{background:#000;color:#fff}
[data-style="brutalist"] .dk{width:64px;height:auto;border:0;border-right:3px solid #000;border-radius:0;background:#fff;color:#000}
[data-style="brutalist"] .dk.open{background:#000;color:#fff}
[data-style="brutalist"] .dk:hover{background:var(--accent);color:var(--accent-ink)}
[data-style="brutalist"] .dk-dot{display:none!important}
[data-style="brutalist"] .dock .grow{display:none}
[data-style="brutalist"] .search{flex:1;width:auto;height:auto;justify-content:flex-start;gap:10px;padding:0 14px;border:0;border-radius:0;box-shadow:none;
  font-weight:700;font-size:14px;text-transform:uppercase;min-width:0}
[data-style="brutalist"] .search:hover{background:var(--hover)}
[data-style="brutalist"] .search .s-lbl{display:inline}
[data-style="brutalist"] .search .s-caret{display:inline-block;width:10px;height:18px;background:#000;animation:blink 1.1s steps(1) infinite}
[data-style="sleek"] .dock{gap:6px}
[data-style="sleek"] .start{height:46px;width:auto;padding:0 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:13px}
[data-style="sleek"] .dk-sep{display:block;width:1px;height:28px;margin:0 6px;background:rgba(255,255,255,.1);flex:none}
[data-style="sleek"] .dk{width:46px;height:46px;border-radius:10px;color:var(--muted)}
[data-style="sleek"] .dk:hover{background:rgba(255,255,255,.04);color:var(--text)}
[data-style="sleek"] .dk.open{background:rgba(255,255,255,.06);color:var(--text)}
[data-style="sleek"] .dk-dot{bottom:3px;width:14px;height:2px;margin-left:-7px;border-radius:2px;background:var(--accent)}
[data-style="sleek"] .search{width:150px;height:40px;justify-content:flex-start;padding:0 8px 0 12px;border-radius:10px;background:rgba(0,0,0,.3);color:var(--muted);min-width:0;flex-shrink:1}
[data-style="sleek"] .search .s-lbl{display:block;flex:1;text-align:left}
[data-style="sleek"] .search kbd{display:block;padding:3px 6px;border:1px solid rgba(255,255,255,.1);border-radius:5px;color:var(--muted)}
@keyframes blink{50%{opacity:0}}

/* ================================================================ windows */
#windows{position:absolute;inset:0;z-index:5;pointer-events:none;isolation:isolate}
.win{position:absolute;display:flex;flex-direction:column;pointer-events:auto;padding:6px;min-width:0;
  transition:opacity .14s ease,transform .14s ease}
.win.min{opacity:0;transform:translateY(28px) scale(.96);visibility:hidden;pointer-events:none;transition:opacity .14s,transform .14s,visibility 0s .14s}
.win-bar{flex:none;height:38px;display:flex;align-items:center;gap:10px;padding:0 2px 0 10px;cursor:default;touch-action:none}
.win-title{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win:not(.focused) .win-title,.win:not(.focused) .win-ic{opacity:.62}
.win-btns{display:flex;gap:2px;flex:none}
.wbtn{width:30px;height:30px;display:grid;place-items:center;padding:0;border:0;border-radius:999px;background:transparent;color:inherit;cursor:pointer}
.wbtn:hover{background:var(--hover)}
.wbtn.close:hover{background:#e5484d;color:#fff}
.win-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:var(--w-radius)}
.rz{position:absolute;z-index:2;touch-action:none}
.rz.e{top:14px;right:-5px;bottom:14px;width:10px;cursor:ew-resize}
.rz.s{left:14px;right:14px;bottom:-5px;height:10px;cursor:ns-resize}
.rz.se{right:-5px;bottom:-5px;width:20px;height:20px;cursor:nwse-resize}
.win.max .rz{display:none}
body.dragging iframe{pointer-events:none}
body.drag-move,body.drag-move *{cursor:default!important}
body.drag-e,body.drag-e *{cursor:ew-resize!important}
body.drag-s,body.drag-s *{cursor:ns-resize!important}
body.drag-se,body.drag-se *{cursor:nwse-resize!important}
body.dragging{user-select:none}
[data-style="glassmorphic"] .win-body{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 0 12px rgba(255,255,255,.1);border-radius:20px}
[data-style="neumorphic"] .win{padding:8px}
[data-style="neumorphic"] .win-body{border-radius:18px}
[data-style="brutalist"] .win{padding:0}
[data-style="brutalist"] .win-bar{height:36px;padding:0 0 0 10px;gap:8px;background:#000;color:#fff;border-bottom:3px solid #000;text-transform:uppercase}
[data-style="brutalist"] .win-title{font-size:12px;font-weight:700}
[data-style="brutalist"] .win.focused .win-bar{background:var(--accent);color:var(--accent-ink)}
[data-style="brutalist"] .win-btns{gap:0;align-self:stretch}
[data-style="brutalist"] .wbtn{width:36px;height:auto;border-radius:0;border-left:3px solid #000;background:#fff;color:#000}
[data-style="brutalist"] .wbtn:hover{background:var(--accent);color:var(--accent-ink)}
[data-style="brutalist"] .wbtn.close:hover{background:#ff4d2e;color:#000}
[data-style="sleek"] .win{padding:0}
[data-style="sleek"] .win-bar{height:40px;padding:0 6px 0 14px;border-bottom:1px solid rgba(255,255,255,.07)}
[data-style="sleek"] .win.focused .win-ic{color:var(--accent)}
[data-style="sleek"] .wbtn{border-radius:8px}
[data-style="sleek"] .win-body{border-radius:0 0 var(--p-radius) var(--p-radius)}
/* Full screen: the window takes the whole screen, over the bar and the dock. */
body.fullwin #windows{z-index:35}
.win.full{left:0!important;top:0!important;width:100%!important;height:100%!important;padding:0;border:0;border-radius:0;box-shadow:none;transition:none}
.win.full .win-bar,.win.full .rz{display:none}
.win.full .win-body{border:0;border-radius:0;box-shadow:none}
/* In full screen, or with the front window maximized, the bars wait off
   screen and slide in over everything when
   the pointer reaches their edge (the .fs-edge strips). */
.win.max{border-radius:0}
.fs-edge{position:absolute;left:0;right:0;height:6px;z-index:41;display:none}
.fs-edge.top{top:0}.fs-edge.bottom{bottom:0}
body.hidebars .fs-edge{display:block}
body.hidebars .topbar{z-index:42;transform:translateY(calc(-100% - 48px));transition:transform .2s ease}
body.hidebars .dock{z-index:42;transform:translateY(calc(100% + 48px));transition:transform .2s ease}
body.hidebars.show-top .topbar,body.hidebars.show-bottom .dock{transform:none}
body.hidebars .start-menu{z-index:43}
body.hidebars .menu{z-index:44}

/* ================================================================ wallpaper */
.wp-img{inset:0;background:center/cover no-repeat}
[data-wp] .wp > *{display:none}
[data-wp] .wp > .wp-img{display:block}
[data-wp] .d-icon:not(.sel) .lbl{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75)}
[data-wp][data-style="brutalist"] .d-icon .lbl{text-shadow:none}

/* ================================================================ menus, start, dialogs, toasts */
.menu{position:absolute;z-index:40;min-width:210px;max-width:300px;padding:6px;border-radius:var(--m-radius);animation:pop .12s ease-out}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border:0;background:transparent;cursor:pointer;text-align:left;
  font-size:13px;color:var(--text);border-radius:max(0px,calc(var(--m-radius) - 8px));text-shadow:inherit}
.menu-item:hover:not(:disabled),.menu-item:focus-visible{background:var(--sel);outline:none}
.menu-item:disabled{opacity:.42;cursor:default}
.menu-item kbd{margin-left:auto;color:var(--muted)}
.menu-item .ic-pad{width:16px;flex:none}
.menu-sep{height:1px;margin:5px 8px;background:currentColor;opacity:.14}
[data-style="brutalist"] .menu-item{text-transform:uppercase;font-size:12px;font-weight:700}
[data-style="brutalist"] .menu-item:hover:not(:disabled),[data-style="brutalist"] .menu-item:focus-visible{color:var(--accent-ink)}
[data-style="brutalist"] .menu-sep{height:3px;margin:5px 0;opacity:1}

.start-menu{position:absolute;left:16px;bottom:calc(var(--dock-h) + 28px);z-index:30;width:min(380px,calc(100% - 32px));
  max-height:calc(100% - var(--dock-h) - var(--bar-h) - 72px);display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--p-radius);animation:pop .14s ease-out}
.sm-search{position:relative;flex:none}
.sm-search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sm-search .inp{height:40px;padding-left:38px}
.sm-sec{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:2px 4px 0}
.sm-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:none}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 2px;border:0;background:transparent;cursor:pointer;font-size:12px;
  color:var(--text);text-shadow:inherit;border-radius:max(0px,calc(var(--m-radius) - 4px))}
.sm-app:hover,.sm-app.hot{background:var(--hover)}
.sm-app .tile{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--b-bg);border:var(--b-border);box-shadow:var(--b-shadow)}
[data-style="brutalist"] .sm-app .tile{border-radius:0}
.sm-list{display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0}
.sm-row{display:flex;align-items:center;gap:10px;min-height:38px;padding:4px 10px;border:0;background:transparent;cursor:pointer;text-align:left;
  color:var(--text);text-shadow:inherit;border-radius:max(0px,calc(var(--m-radius) - 6px))}
.sm-row:hover,.sm-row.hot{background:var(--sel)}
[data-style="brutalist"] .sm-row:hover,[data-style="brutalist"] .sm-row.hot{color:var(--accent-ink)}
.sm-row .ic{color:var(--ic)}
.sm-row.hot .ic,[data-style="brutalist"] .sm-row:hover .ic{color:inherit}
.sm-txt{min-width:0;display:flex;flex-direction:column}
.sm-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-path{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-none{padding:10px;color:var(--muted);font-size:12.5px}
.sm-foot{display:flex;justify-content:space-between;gap:10px;padding:8px 4px 0;font-size:11.5px;color:var(--muted);border-top:1px solid color-mix(in srgb,currentColor 12%,transparent)}
.start.on,.search.on{filter:brightness(.94)}

.scrim{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.28)}
.dialog{width:min(420px,100%);padding:20px;border-radius:var(--m-radius);animation:pop .14s ease-out}
.dialog h2{margin:0 0 6px;font-size:15px;font-weight:650;overflow-wrap:anywhere}
.dialog p{margin:0 0 14px;color:var(--muted);line-height:1.5}
[data-style="brutalist"] .dialog h2{font:400 17px var(--display);text-transform:uppercase}
.dlg-err{color:#e5484d;font-size:12px;margin-top:6px;min-height:1px}
[data-style="glassmorphic"]:not([data-tone="light"]) .dlg-err{color:#ffc9c9}
.dlg-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.picker{width:min(520px,100%)}
.picker .f-crumbs{margin:2px 0 8px;padding:0}
.pk-list{height:260px;overflow:auto;padding:6px}
.pk-row{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;cursor:default;border-radius:max(0px,calc(var(--w-radius) - 8px))}
.pk-row:hover{background:var(--hover)}
.pk-row.sel{background:var(--sel)}
[data-style="brutalist"] .pk-row.sel{color:var(--accent-ink)}
.pk-row .ic{color:var(--ic)}
.pk-row.sel .ic{color:inherit}
.pk-row.dim{opacity:.5}
.pk-name{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:500}
.pk-name .inp{flex:1}

#toasts{position:absolute;right:16px;bottom:calc(var(--dock-h) + 28px);z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.toast{max-width:min(380px,calc(100vw - 32px));padding:10px 14px;font-size:13px;line-height:1.45;border-radius:var(--m-radius);animation:rise .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.985)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================================================================ Files */
.files{display:flex;flex:1;min-height:0;container-type:inline-size}
.f-side{width:168px;flex:none;display:flex;flex-direction:column;gap:2px;padding:10px 8px}
.f-sec{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:2px 10px 6px}
.f-place{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;background:transparent;cursor:pointer;text-align:left;color:var(--text);text-shadow:inherit;
  border-radius:max(0px,calc(var(--w-radius) - 6px))}
.f-place:hover{background:var(--hover)}
.f-place.on{background:var(--sel)}
.f-place.drop{outline:2px dashed var(--accent);outline-offset:-2px}
[data-style="brutalist"] .f-place{text-transform:uppercase;font-weight:700;font-size:12px}
[data-style="brutalist"] .f-place.on{color:var(--accent-ink)}
.f-usage{font-size:11.5px;color:var(--muted);padding:8px 10px 2px}
.f-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding:10px 10px 0 0}
.f-tool{display:flex;align-items:center;gap:6px}
.f-crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:1px;height:32px;padding:0 4px;overflow:hidden;white-space:nowrap}
.crumb{border:0;background:transparent;padding:4px 7px;border-radius:7px;cursor:pointer;font-weight:550;color:var(--text);text-shadow:inherit;flex:none;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.crumb:hover{background:var(--hover)}
.crumb.drop{outline:2px dashed var(--accent)}
.crumb-sep{color:var(--faint);flex:none}
.f-grid{flex:1;min-height:0;overflow:auto;padding:10px;outline:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));align-content:start;gap:4px}
.f-grid.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.f-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;cursor:default;font-size:12px;text-align:center;
  border-radius:max(0px,calc(var(--w-radius) - 6px))}
.f-item:hover{background:var(--hover)}
.f-item.sel{background:var(--sel)}
[data-style="brutalist"] .f-item.sel{color:var(--accent-ink)}
.f-item.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.f-ic{color:var(--ic)}
.f-item.sel .f-ic{color:inherit}
.f-nm{max-width:100%;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.f-empty{grid-column:1/-1;padding:44px 12px;text-align:center;color:var(--muted);line-height:1.6}
.f-status{flex:none;height:30px;display:flex;align-items:center;gap:6px;padding:0 4px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.f-status span:last-child{overflow:hidden;text-overflow:ellipsis}
@container (max-width:520px){.f-side{display:none}.f-main{padding-left:10px}}

/* ================================================================ Text Editor */
.ed{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 10px 0}
.ed-tool{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ed-text{flex:1;min-height:0;width:100%;resize:none;margin:0;padding:12px 14px;outline:none;user-select:text;text-shadow:none;color:var(--text);
  font:13px/1.6 var(--mono);tab-size:4;white-space:pre-wrap;overflow-wrap:anywhere}
.ed-text.nowrap{white-space:pre;overflow-wrap:normal;overflow-x:auto}
.ed-text:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:-1px}
.ed-status{flex:none;height:30px;display:flex;align-items:center;gap:16px;padding:0 4px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.ed-path{min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
@container (max-width:460px){.ed-tool .btn span{display:none}}
.ed{container-type:inline-size}

/* ================================================================ Browser */
.br-frame{flex:1;display:block;width:100%;min-height:0;border:0;background:#0b0e14}
.br-empty{margin:auto;max-width:360px;padding:24px;text-align:center;color:var(--muted);line-height:1.55}
.br-empty strong{display:block;margin-bottom:6px;color:var(--text);font-size:14px}

/* ================================================================ Terminal */
.tm{flex:1;min-height:0;display:flex;flex-direction:column}
.tm-login{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:20px}
.tm-card{width:min(340px,100%);display:flex;flex-direction:column;gap:10px}
.tm-card h3{margin:4px 0 0;font-size:15px;font-weight:650;overflow-wrap:anywhere}
[data-style="brutalist"] .tm-card h3{font:400 17px var(--display);text-transform:uppercase}
.tm-card p{margin:0;color:var(--muted);line-height:1.5}
.tm-card .dlg-err{margin:0}
.tm-card .btn{align-self:flex-end}
.tm-lock{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--ic);background:var(--b-bg);border:var(--b-border);box-shadow:var(--b-shadow)}
[data-style="brutalist"] .tm-lock{border-radius:0}
.tm-screen{flex:1;min-height:0;overflow:auto;margin:10px 10px 0;padding:10px 12px;cursor:text;user-select:text;text-shadow:none;color:var(--text);
  font:13px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.tm-out{margin:0;font:inherit;white-space:inherit}
.tm-note{color:var(--muted);font-style:italic}
.tm-cur{display:flex;align-items:baseline}
.tm-tail{flex:none;max-width:100%;white-space:pre-wrap}
.tm-in{flex:1;min-width:48px;height:auto;margin:0;padding:0;border:0;outline:none;background:transparent;font:inherit;color:inherit;user-select:text}
.tm-ended{padding-top:8px;user-select:none}
.tm-status{flex:none;height:30px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.tm-status span:last-child{overflow:hidden;text-overflow:ellipsis}
.tm-dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--faint)}
.tm-dot.on{background:#3fb950}
[data-style="brutalist"] .tm-dot{border-radius:0}

/* ================================================================ Settings */
.set{flex:1;min-height:0;overflow:auto;padding:18px 20px 22px;display:flex;flex-direction:column;gap:24px;container-type:inline-size}
.set h3{margin:0 0 10px;font-size:14px;font-weight:650}
[data-style="brutalist"] .set h3{font:400 16px var(--display);text-transform:uppercase}
.set p{margin:0 0 10px;color:var(--muted);line-height:1.55}
.set-lbl{font-size:12px;font-weight:600;margin:14px 0 8px}
.set-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.os-styles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@container (max-width:520px){.os-styles{grid-template-columns:repeat(2,1fr)}}
.os-style{display:flex;flex-direction:column;gap:8px;padding:7px 7px 9px;cursor:pointer;text-align:left;color:var(--text);text-shadow:inherit;
  background:var(--b-bg);border:var(--b-border);box-shadow:var(--b-shadow);border-radius:min(var(--p-radius),14px)}
.os-style:hover{background:var(--hover)}
.os-style.active{outline:2px solid var(--accent);outline-offset:2px}
[data-style="glassmorphic"] .os-style.active{outline-color:#fff}
.os-style .nm{font-size:12px;font-weight:550;padding:0 2px}
.os-thumb{--a:#888;position:relative;display:block;aspect-ratio:4/3;border-radius:6px;overflow:hidden}
.os-thumb i,.os-thumb b{position:absolute;display:block}
.os-thumb .t-bar{left:4%;top:5%;width:56%;height:9%}
.os-thumb .t-clock{right:4%;top:5%;width:30%;height:24%}
.os-thumb .t-win{left:22%;top:24%;width:52%;height:44%}
.os-thumb .t-dock{left:4%;bottom:5%;width:56%;height:15%}
.os-thumb .t-dock b{left:5%;top:18%;width:22%;height:64%;background:var(--a)}
.os-thumb.glassmorphic{background:radial-gradient(60% 55% at 78% 18%,color-mix(in srgb,var(--a) 55%,#fff),transparent),radial-gradient(55% 60% at 12% 90%,color-mix(in srgb,var(--a) 70%,#000),transparent),var(--a)}
.os-thumb.glassmorphic i{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.6);border-radius:6px}
.os-thumb.glassmorphic .t-bar{border-radius:99px}
.os-thumb.glassmorphic .t-dock b{border-radius:3px;background:color-mix(in srgb,var(--a) 18%,#fff)}
.os-thumb.neumorphic{--base:color-mix(in srgb,var(--a) 10%,#e3e6e1);background:var(--base)}
.os-thumb.neumorphic i{background:var(--base);border-radius:6px;box-shadow:2px 2px 4px color-mix(in srgb,var(--base) 78%,#000),-2px -2px 4px #fff}
.os-thumb.neumorphic .t-bar{border-radius:99px}
.os-thumb.neumorphic .t-dock b{border-radius:3px}
.os-thumb.brutalist{background:#efece3}
.os-thumb.brutalist i{background:#fff;border:2px solid #000;box-shadow:2px 2px 0 #000}
.os-thumb.brutalist .t-win{border-top-width:6px}
.os-thumb.brutalist .t-dock b{top:0;left:0;height:100%;border-right:2px solid #000}
.os-thumb.sleek{background:radial-gradient(45% 50% at 70% 72%,color-mix(in srgb,var(--a) 28%,transparent),transparent),
  linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/10px 10px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/10px 10px,#0a0b0d}
.os-thumb.sleek i{background:linear-gradient(#18191d,#121316);border:1px solid rgba(255,255,255,.12);border-radius:4px}
.os-thumb.sleek .t-dock b{border-radius:2px}
.swatch{position:relative;width:30px;height:30px;flex:none;padding:0;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.swatch.on{box-shadow:0 0 0 2px var(--text)}
.swatch.custom{display:grid;place-items:center;overflow:hidden;background:conic-gradient(#f43f5e,#f59e0b,#84cc16,#14b8a6,#3b82f6,#a855f7,#f43f5e)}
.swatch.custom.on::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--accent);border:2px solid #fff;pointer-events:none}
.swatch.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
[data-style="brutalist"] .swatch{border-radius:0;border:2px solid #000;box-shadow:2px 2px 0 #000}
[data-style="brutalist"] .swatch.on{outline:3px solid #000;outline-offset:2px}
[data-style="brutalist"] .swatch.custom.on::after{border-radius:0;border-color:#000}
.hex{font:500 12px var(--mono);color:var(--muted)}
.wp-grid-set{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.wp-tile{position:relative;display:flex;flex-direction:column;gap:6px;padding:6px 6px 8px;cursor:pointer;text-align:left;color:var(--text);text-shadow:inherit;
  background:var(--b-bg);border:var(--b-border);box-shadow:var(--b-shadow);border-radius:min(var(--p-radius),14px)}
.wp-tile:hover{background:var(--hover)}
.wp-tile.active{outline:2px solid var(--accent);outline-offset:2px}
[data-style="glassmorphic"] .wp-tile.active{outline-color:#fff}
.wp-thumb{display:grid;place-items:center;aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:center/cover no-repeat var(--desk);color:var(--muted)}
.wp-thumb.add{background:var(--w-bg);box-shadow:var(--w-shadow)}
.wp-tile .nm{font-size:12px;font-weight:550;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp-del{position:absolute;top:10px;right:10px;width:24px;height:24px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;cursor:pointer;
  background:rgba(0,0,0,.55);color:#fff;opacity:0;transition:opacity .12s}
.wp-tile:hover .wp-del,.wp-del:focus-visible{opacity:1}
.wp-del:hover{background:#e5484d}
[data-style="brutalist"] .wp-tile,[data-style="brutalist"] .wp-thumb,[data-style="brutalist"] .wp-del{border-radius:0}

@media (max-width:760px){
  .topbar{width:calc(100% - 32px)}
  .clock{display:none}
  .tb-menu{padding:5px 7px}
}
@media (max-width:520px){
  .tb-menu[data-menu="go"],.tb-ram{display:none}
}
</style>
</head>
<body>
<div id="desktop">
  <div class="wp" aria-hidden="true"><div class="wp-img" id="wp-img"></div><div class="wp-grid"></div><div class="wp-glow"></div><div class="wp-type">PLO
VER</div></div>

  <div id="icons" aria-label="Desktop"></div>

  <div id="clock" class="clock panel" aria-hidden="true">
    <div class="ck-in">
      <div class="ck-head"><span class="ck-day"></span><span class="ck-ampm"></span></div>
      <div class="ck-time"></div>
      <div class="ck-rule"></div>
      <div class="ck-date"></div>
    </div>
  </div>

  <div id="windows"></div>

  <header id="topbar" class="topbar panel">
    <nav class="tb-left" aria-label="Menu bar">
      <span class="tb-logo" aria-hidden="true"></span>
      <span class="tb-app" id="tb-app">Desktop</span>
      <button class="tb-menu" data-menu="file" aria-haspopup="menu">File</button>
      <button class="tb-menu" data-menu="view" aria-haspopup="menu">View</button>
      <button class="tb-menu" data-menu="go" aria-haspopup="menu">Go</button>
    </nav>
    <div class="tb-right">
      <button class="tb-ic" id="tb-net" aria-haspopup="dialog"></button>
      <button class="tb-ic" id="tb-full" aria-label="Full screen" title="Full screen"></button>
      <span class="tb-ram" id="tb-ram" hidden></span>
    </div>
  </header>

  <nav id="dock" class="dock panel" aria-label="Dock">
    <button class="start" id="start-btn" aria-haspopup="dialog"></button>
    <span class="dk-sep"></span>
    <span id="dock-apps"></span>
    <span class="grow"></span>
    <button class="search" id="search-btn" aria-label="Search apps and files"></button>
  </nav>

  <div id="start" class="start-menu panel" role="dialog" aria-label="Start" hidden>
    <div class="sm-search"><span id="sm-ic"></span><input class="inp" id="sm-q" type="text" spellcheck="false" autocomplete="off" placeholder="Search apps and files"></div>
    <div class="sm-sec" id="sm-apps-lbl">Apps</div>
    <div class="sm-apps" id="sm-apps"></div>
    <div class="sm-sec" id="sm-list-lbl">Recent</div>
    <div class="sm-list" id="sm-list"></div>
    <div class="sm-foot"><span id="sm-server"></span><span>Plover</span></div>
  </div>

  <div id="toasts" aria-live="polite"></div>
</div>

<script>
(function () {

const CFG_IN = /*__PLOVER_OS__*/null;

const BUILT = !/^__PLOVER_/.test(CLIENT_HTML);

// main.js sends its own style table with the config; this one is only for

const STYLES = (CFG_IN && CFG_IN.styles) || {

};
const HEX = /^#[0-9a-f]{6}$/i;
const CFG = Object.assign({ id: "preview", name: "Plover" }, CFG_IN || {});

// ------------------------------------------------------------------ helpers
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function html(s) { const t = document.createElement("template"); t.innerHTML = s.trim(); return t.content.firstElementChild; }

const ICONS = {
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  open: '<path d="M3 17V7a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v1"/><path d="M3 17l2.4-5.6A2 2 0 0 1 7.2 10H21l-2.6 7.6a2 2 0 0 1-1.9 1.4H5a2 2 0 0 1-2-2z"/>',

  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  wifi: '<path d="M2 9a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/>',
  wifiOff: '<path d="m3 3 18 18"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/><path d="M5 12.5a10 10 0 0 1 4.8-2.7"/><path d="M2 9a15 15 0 0 1 4-2.6"/><path d="M14.9 10A10 10 0 0 1 19 12.5"/><path d="M10.6 4.1A15 15 0 0 1 22 9"/>',
  full: '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
  unfull: '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>',
  min: '<path d="M5 12h14"/>',

  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',

};
// name is a key of ICONS, or an installed app's own icon as a data: URL.
function ic(name, size = 18, width = 1.75) {
  if (/^data:image\//.test(name)) return '<img class="ic" width="' + size + '" height="' + size + '" alt="" src="' + esc(name) + '">';
  return '<svg class="ic" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + width +
    '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || "") + "</svg>";
}

function fmtSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1).replace(/\.0$/, "") + " KB";
  return (n / 1048576).toFixed(1).replace(/\.0$/, "") + " MB";
}
const bytes = (s) => new TextEncoder().encode(s).length;
const fmtTime = (t) => new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

function lum(hex) {
  const n = parseInt(hex.slice(1), 16);
  const [r, g, b] = [n >> 16, (n >> 8) & 255, n & 255].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

const toastBox = $("#toasts");
function toast(msg) {
  const t = html('<div class="toast panel" role="status"></div>');
  t.textContent = msg;
  toastBox.append(t);
  setTimeout(() => t.remove(), 3600);
}

// ------------------------------------------------------------------ storage
// One JSON document per server: the file tree, the look, recent files.
// Nodes: folder {t:"d", m, c:{name: node}}, text file {t:"f", m, s}.
const KEY = "plover-os:" + CFG.id;
const PROTECTED = new Set(["/Desktop", "/Documents"]);
const WELCOME = [
  "Welcome to Plover.",
  "",
  "Browser      The Plover browser. Pages run on the server and stream here.",
  "Files        Your folders. Drag files in from your computer to import them.",
  "Text Editor  Plain-text files. Ctrl+S saves, Ctrl+Shift+S saves a copy.",
  "Terminal     A command prompt on the server, after you sign in with its password.",
  "Settings     Change the desktop's style, accent color and wallpaper.",
  "",
  "Your files are kept in this web browser, on this computer, for this desktop",
  "only. Download a backup from Settings to move them somewhere else.",
  "",
  "Tips",
  "- Double-click a window's title bar to maximize it.",
  "- Ctrl+K searches apps and files.",
  "- Right-click the desktop or a file for more actions.",
  "- Drag icons anywhere on the desktop. Right-click it to turn grid snap on or off.",
  "",
].join("\n");

let storageOk = true;
const state = (() => {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (_) { storageOk = false; }
  const fs = raw && cleanTree(raw.fs);
  const s = {
    v: 1,
    fs: fs && fs.t === "d" ? fs : freshTree(),
    prefs: raw && raw.prefs && typeof raw.prefs === "object" ? raw.prefs : {},
    recent: raw && Array.isArray(raw.recent) ? raw.recent.filter((p) => typeof p === "string") : [],
    wrap: !(raw && raw.wrap === false),
    // Desktop icons: where each was put (by icon key, in px), and grid snap.
    desk: { pos: cleanPos(raw && raw.desk && raw.desk.pos), snap: !(raw && raw.desk && raw.desk.snap === false) },
  };
  ensureBase(s.fs);
  return s;
})();

function freshTree() {
  const m = Date.now();
  return { t: "d", m, c: {
    Desktop: { t: "d", m, c: { "Welcome.txt": { t: "f", m, s: WELCOME } } },
    Documents: { t: "d", m, c: {} },
  } };
}
function ensureBase(root) {
  for (const p of PROTECTED) {
    const name = p.slice(1);
    if (!root.c[name] || root.c[name].t !== "d") root.c[name] = { t: "d", m: Date.now(), c: {} };
  }

  scrim.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); onCancel(); } });
  return () => { scrim.remove(); if (prev && document.contains(prev) && prev.focus) prev.focus(); };
}

// buttons: [{label, value, primary?, danger?}]. With an input, the primary
// button resolves to its trimmed text (after input.validate passes).
function dialog({ title, message = "", input = null, buttons }) {
  return new Promise((resolve) => {
    const scrim = html('<div class="scrim"><div class="dialog panel" role="alertdialog" aria-modal="true"><h2></h2>' +
      (message ? "<p></p>" : "") + (input ? '<input class="inp" type="text" spellcheck="false" autocomplete="off">' : "") +
      '<div class="dlg-err" role="alert"></div><div class="dlg-btns"></div></div></div>');
    const box = scrim.firstElementChild, field = $(".inp", box), err = $(".dlg-err", box), row = $(".dlg-btns", box);
    $("h2", box).textContent = title;
    box.setAttribute("aria-label", title);
    if (message) $("p", box).textContent = message;
    const close = modal(scrim, () => done(null));
    function done(v) { close(); resolve(v); }
    let primary = null;
    function submit(b) {
      if (!field || !b.primary) return done(b.value);
      const v = field.value.trim(), msg = input.validate ? input.validate(v) : "";
      if (msg) { err.textContent = msg; field.focus(); return; }
      done(v);
    }
    for (const b of buttons) {
      const el = html('<button class="btn' + (b.primary ? " primary" : "") + (b.danger ? " danger" : "") + '"></button>');
      el.textContent = b.label;
      el.addEventListener("click", () => submit(b));
      row.append(el);
      if (b.primary) primary = { b, el };
    }
    if (field) {
      field.value = input.value || "";
      field.addEventListener("keydown", (e) => { if (e.key === "Enter" && primary) { e.preventDefault(); submit(primary.b); } });
      field.addEventListener("input", () => { err.textContent = ""; });
      field.focus();
      const dot = field.value.lastIndexOf(".");
      field.setSelectionRange(0, input.stem && dot > 0 ? dot : field.value.length);
    } else (primary ? primary.el : row.lastElementChild).focus();
  });
}
const ask = (o) => dialog({ title: o.title, message: o.message, input: { value: o.value, validate: o.validate, stem: true },
  buttons: [{ label: "Cancel", value: null }, { label: o.ok || "OK", primary: true }] });

// A small folder browser for Open and Save as. Resolves to a path or null.
function pickPath({ mode, dir, name = "" }) {
  return new Promise((resolve) => {
    const save = mode === "save";
    let cur = isDir(dir) ? dir : "/Documents", sel = null;
    const scrim = html('<div class="scrim"><div class="dialog picker panel" role="dialog" aria-modal="true" aria-label="' + (save ? "Save as" : "Open a file") + '">' +
      "<h2>" + (save ? "Save as" : "Open a file") + '</h2><div class="f-crumbs"></div><div class="pk-list well" tabindex="0"></div>' +
      (save ? '<label class="pk-name"><span>Name</span><input class="inp" type="text" spellcheck="false" autocomplete="off"></label>' : "") +
      '<div class="dlg-err" role="alert"></div><div class="dlg-btns"><button class="btn" data-v="cancel">Cancel</button>' +
      '<button class="btn primary" data-v="ok">' + (save ? "Save" : "Open") + "</button></div></div></div>");
    const box = scrim.firstElementChild, crumbsEl = $(".f-crumbs", box), listEl = $(".pk-list", box), err = $(".dlg-err", box);
    const field = $(".inp", box), okBtn = $('[data-v="ok"]', box);
    const close = modal(scrim, () => done(null));
    function done(v) { close(); resolve(v); }
    function render() {
      crumbsEl.innerHTML = crumbs(cur);
      const items = list(cur);
      listEl.innerHTML = items.length ? items.map((e) =>
        '<div class="pk-row' + (e.path === sel ? " sel" : "") + (save && e.node.t === "f" ? " dim" : "") + '" data-path="' + esc(e.path) + '">' +
        ic(e.node.t === "d" ? "folder" : "file", 18) + "<span>" + esc(e.name) + "</span></div>").join("")
        : '<div class="sm-none">This folder is empty.</div>';
      if (!save) okBtn.disabled = !(sel && isFile(sel));
    }
    function ok() {
      if (!save) { if (sel && isFile(sel)) done(sel); return; }
      const v = field.value.trim(), msg = validName(v) || (isDir(joinPath(cur, v)) ? "There's a folder with that name here." : "");
      if (msg) { err.textContent = msg; field.focus(); return; }
      done(joinPath(cur, v));
    }
    crumbsEl.addEventListener("click", (e) => { const c = e.target.closest(".crumb"); if (c) { cur = c.dataset.go; sel = null; render(); } });
    // Selection only restyles the rows: rebuilding them here would swap the
    // element out from under the second click of a double-click.
    listEl.addEventListener("click", (e) => {
      const r = e.target.closest(".pk-row");
      sel = r ? r.dataset.path : null;
      for (const row of $$(".pk-row", listEl)) row.classList.toggle("sel", row === r);
      if (save && sel && isFile(sel)) field.value = basename(sel);
      if (!save) okBtn.disabled = !(sel && isFile(sel));
    });
    listEl.addEventListener("dblclick", (e) => {
      const r = e.target.closest(".pk-row");
      if (!r) return;
      if (isDir(r.dataset.path)) { cur = r.dataset.path; sel = null; render(); }
      else { sel = r.dataset.path; if (save) field.value = basename(sel); ok(); }
    });
    $('[data-v="cancel"]', box).addEventListener("click", () => done(null));
    okBtn.addEventListener("click", ok);
    if (field) {
      field.value = name;
      field.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); ok(); } });
      field.addEventListener("input", () => { err.textContent = ""; });
    }
    render();
    if (field) { field.focus(); const dot = name.lastIndexOf("."); field.setSelectionRange(0, dot > 0 ? dot : name.length); }
    else listEl.focus();
  });
}

function crumbs(dir) {
  let out = '<button class="crumb" data-go="/">Home</button>', acc = "";
  for (const p of parts(dir)) {
    acc += "/" + p;

}

const MAX_IMPORT = 1048576;
async function importFiles(files, dir) {
  let n = 0;
  for (const f of files) {
    if (f.size > MAX_IMPORT) { toast(f.name + " is larger than 1 MB, so it wasn't imported."); continue; }
    let text;
    try { text = await f.text(); } catch (_) { toast("Couldn't read " + f.name + "."); continue; }
    if (text.includes("\u0000")) { toast(f.name + " isn't a text file, so it wasn't imported."); continue; }
    const clean = f.name.replace(/[\/\\]/g, "_");
    const name = freeName(dir, validName(clean) ? "Imported file" : clean);
    if (tryFs(() => { writeFile(joinPath(dir, name), text); return true; })) n++;
  }
  if (n) toast("Imported " + n + " file" + (n === 1 ? "" : "s") + " into " + (basename(dir) || "Home") + ".");
}
function chooseImport(dir) {
  const input = html('<input type="file" multiple hidden>');
  input.addEventListener("change", () => { importFiles([...input.files], dir); input.remove(); });
  document.body.append(input);
  input.click();
}

// Drag and drop: items moved between folders, and files dropped in from the
// computer. dragPath is the item being dragged; drop targets resolve the
// element under the pointer to {el, dir} or null.
const DRAG_TYPE = "application/x-plover-path";
let dragPath = null;
const external = (e) => [...e.dataTransfer.types].includes("Files");
function canDrop(e, dir) {
  if (external(e)) return true;
  return !!dragPath && dir !== dirname(dragPath) && !within(dir, dragPath);
}
function startItemDrag(e, path) {
  dragPath = path;
  e.dataTransfer.setData(DRAG_TYPE, path);
  e.dataTransfer.effectAllowed = "move";
}
function wireDrops(root, resolve) {
  let hot = null;
  const mark = (el) => { if (hot === el) return; if (hot) hot.classList.remove("drop"); hot = el; if (hot) hot.classList.add("drop"); };
  root.addEventListener("dragover", (e) => {
    const t = resolve(e.target);
    if (!t || !canDrop(e, t.dir)) { mark(null); return; }
    e.preventDefault();
    e.stopPropagation();
    e.dataTransfer.dropEffect = external(e) ? "copy" : "move";
    mark(t.el);
  });
  root.addEventListener("dragleave", (e) => { if (!root.contains(e.relatedTarget)) mark(null); });
  root.addEventListener("drop", (e) => {
    const t = resolve(e.target);
    mark(null);
    if (!t || !canDrop(e, t.dir)) return;
    e.preventDefault();
    e.stopPropagation();
    if (external(e)) importFiles([...e.dataTransfer.files], t.dir);
    else tryFs(() => movePath(dragPath, t.dir));
    dragPath = null;
  });
}
document.addEventListener("dragend", () => { dragPath = null; });
// A file dropped anywhere else must not replace this page with itself.
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => e.preventDefault());

// ================================================================ apps
const APPS = {
  browser: { name: "Browser", icon: "globe", open: () => openBrowser() },
  files: { name: "Files", icon: "folder", open: () => openFiles("/") },
  editor: { name: "Text Editor", icon: "edit", open: () => openEditor(null) },

};
const APP_ORDER = ["browser", "files", "editor", "terminal", "settings"];

// ---------------------------------------------------------------- installed apps
// Single HTML files picked in Plover Server, built into this page (CFG.apps).
// Each runs in a sandboxed frame with an opaque origin, so it can't reach this
// page, its files or the token; this page's CSP still applies to it, so it
// can't load anything from the network either. Its localStorage is a stand-in
// (appShim) that this page keeps under "plover-os:<server id>:app:<app id>".
const APP_DATA_MAX = 1024 * 1024;
const installed = new Map();   // key -> {id, name, icon, html}
for (const a of Array.isArray(CFG.apps) ? CFG.apps : []) {
  if (!a || typeof a.html !== "string" || !/^[a-z0-9]{6,32}$/.test(a.id || "")) continue;
  const key = "app-" + a.id, name = String(a.name || "App");
  installed.set(key, { id: a.id, name, html: a.html });
  APPS[key] = { name, icon: /^data:image\/png;base64,/.test(a.icon || "") ? a.icon : "app", open: () => openInstalled(key) };
  APP_ORDER.splice(APP_ORDER.length - 1, 0, key);   // before Settings
}

function openInstalled(key) {
  const a = area();
  return openWin({ app: key, key, title: APPS[key].name, w: Math.min(960, a.w - 160), h: Math.min(680, a.h), minW: 320, minH: 220, mount: (win) => mountInstalled(win, key) });
}

// Runs inside the app's frame before its own scripts: localStorage and
// sessionStorage the sandbox would otherwise refuse, and the page title for
// the window. Writes go to this page by postMessage.
function appShim(seed) {
  const post = (m) => parent.postMessage(Object.assign({ plover: "app" }, m), "*");
  const make = (data, keep) => {
    const map = new Map(Object.entries(data));
    return {
      get length() { return map.size; },
      key: (i) => { const k = [...map.keys()][i]; return k === undefined ? null : k; },
      getItem: (k) => (map.has(String(k)) ? map.get(String(k)) : null),
      setItem: (k, v) => { map.set(String(k), String(v)); if (keep) post({ t: "set", k: String(k), v: String(v) }); },
      removeItem: (k) => { if (map.delete(String(k)) && keep) post({ t: "remove", k: String(k) }); },
      clear: () => { map.clear(); if (keep) post({ t: "clear" }); },
    };
  };
  for (const [name, data, keep] of [["localStorage", seed, true], ["sessionStorage", {}, false]]) {
    try { Object.defineProperty(window, name, { value: make(data, keep), configurable: true }); } catch (_) {}
  }
  addEventListener("DOMContentLoaded", () => {
    const title = () => post({ t: "title", v: document.title });
    title();
    new MutationObserver(title).observe(document.head || document.documentElement, { subtree: true, childList: true, characterData: true });
  });
}

// Without a prototype, so an app's "__proto__" key is just a key.
function loadAppData(id) {
  const out = Object.create(null);
  try {
    const d = JSON.parse(localStorage.getItem(KEY + ":app:" + id) || "{}");
    if (d && typeof d === "object" && !Array.isArray(d)) for (const [k, v] of Object.entries(d)) if (typeof v === "string") out[k] = v;
  } catch (_) {}
  return out;
}

// The app's file with the shim put first in its <head> (or as near as it has).
function appDoc(html, seed) {
  const s = "<script>(" + appShim + ")(" + JSON.stringify(seed).replace(/</g, "\\u003c") + ");<\/script>";
  const m = /<head\b[^>]*>/i.exec(html) || /<html\b[^>]*>/i.exec(html) || /<!doctype[^>]*>/i.exec(html);
  return m ? html.slice(0, m.index + m[0].length) + s + html.slice(m.index + m[0].length) : s + html;
}

function mountInstalled(win, key) {
  const app = installed.get(key), storeKey = KEY + ":app:" + app.id;
  const data = loadAppData(app.id);
  let saveTimer = 0, warned = false;
  const save = () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(storeKey, JSON.stringify(data)); }
      catch (_) { if (!warned) { warned = true; toast("This browser isn't letting " + app.name + " save."); } }
    }, 250);
  };
  const f = document.createElement("iframe");
  f.className = "br-frame app-frame";
  f.title = app.name;
  f.sandbox = "allow-scripts allow-forms allow-modals allow-popups allow-downloads allow-pointer-lock";
  f.allow = "fullscreen; autoplay; clipboard-write";
  f.srcdoc = appDoc(app.html, data);
  win.body.append(f);

  const onMessage = (e) => {
    const m = e.data;
    if (e.source !== f.contentWindow || !m || m.plover !== "app") return;
    if (m.t === "title") { win.setTitle(typeof m.v === "string" && m.v.trim() ? m.v.trim().slice(0, 120) : app.name); return; }
    if (m.t === "clear") { for (const k of Object.keys(data)) delete data[k]; save(); return; }
    if (typeof m.k !== "string") return;
    if (m.t === "remove") { delete data[m.k]; save(); return; }
    if (m.t !== "set" || typeof m.v !== "string") return;
    const old = data[m.k];
    data[m.k] = m.v;
    if (bytes(JSON.stringify(data)) > APP_DATA_MAX) {
      if (old === undefined) delete data[m.k]; else data[m.k] = old;
      if (!warned) { warned = true; toast(app.name + " is out of storage space (" + fmtSize(APP_DATA_MAX) + "). Some changes weren't saved."); }
      return;
    }
    save();
  };
  addEventListener("message", onMessage);
  win.onFocus = () => { if (document.activeElement !== f) f.focus(); };
  win.onClosed = () => {
    removeEventListener("message", onMessage);
    if (saveTimer) { clearTimeout(saveTimer); try { localStorage.setItem(storeKey, JSON.stringify(data)); } catch (_) {} }
  };
}

// ---------------------------------------------------------------- Terminal
// Signs in to the server like an ssh client: its own socket to the stream,
// the access token, and the terminal password typed here (never stored).
// The shell runs on pipes, not a terminal, so this side edits each line,
// echoes it and sends it on Enter.
const ANSI = /\x1b(?:\[[0-?]*[ -\/]*[@-~]|\][^\x07\x1b]*(?:\x07|\x1b\\)|[@-Z\\-_])/g;
const CTRL = /[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g;
const MAX_SCREEN = 400000;
const termHistory = [];

function openTerminal() {
  return openWin({ app: "terminal", title: "Terminal", w: 760, h: 480, minW: 340, minH: 240, mount: mountTerminal });
}

function closeReason(code) {
  if (code === 4401) return "The server refused this desktop’s access token. Download the desktop again from Plover Server.";
  if (code === 4429) return "Too many attempts. Wait a minute and try again.";
  if (code === 1006 || code === 1015) return "Couldn’t reach the server. Check that it’s running and try again.";
  return "The server closed the connection (" + code + ").";
}

function mountTerminal(win) {
  if (!BUILT || !CFG.server || !CFG.token) {
    win.body.innerHTML = '<div class="br-empty"><strong>No server connected</strong>This desktop is a preview. Download it from Plover Server to open a terminal on your server.</div>';
    return;
  }
  const body = win.body;
  let ws = null, ready = false, lastErr = "", view = null;

  // ---- sign in
  function showLogin(err) {
    ready = false;
    win.setTitle("Terminal");
    body.innerHTML = '<div class="tm"><div class="tm-login"><div class="tm-card">' +
      '<span class="tm-lock">' + ic("lock", 22) + "</span><h3></h3>" +
      "<p>Enter the terminal password for this server. Commands you run here run on the server, as the person who runs it.</p>" +
      '<input class="inp" type="password" autocomplete="current-password" placeholder="Password" aria-label="Terminal password">' +
      '<div class="dlg-err" role="alert"></div><button class="btn primary">Connect</button></div></div></div>';
    $("h3", body).textContent = "Sign in to " + CFG.name;
    const pw = $(".inp", body), btn = $(".btn", body), errEl = $(".dlg-err", body);
    errEl.textContent = err || "";
    const go = () => {
      if (!pw.value) { errEl.textContent = "Enter the password."; pw.focus(); return; }
      btn.disabled = pw.disabled = true;
      btn.textContent = "Connecting…";
      errEl.textContent = "";
      connect(pw.value);
      pw.value = "";
    };
    btn.addEventListener("click", go);
    pw.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); go(); } });
    pw.addEventListener("input", () => { errEl.textContent = ""; });
    view = { focus: () => pw.focus({ preventScroll: true }) };
    if (focused === win) view.focus();
  }

  function connect(password) {
    lastErr = "";
    let sock;
    try { sock = new WebSocket(CFG.server); }
    catch (e) { showLogin("Couldn’t connect: " + e.message); return; }
    ws = sock;
    sock.binaryType = "arraybuffer";
    sock.onopen = () => {
      const device = "Web OS terminal" + (navigator.userAgentData && navigator.userAgentData.platform ? " on " + navigator.userAgentData.platform : "");
      sock.send(JSON.stringify({ t: "auth", proto: 1, mode: "terminal", token: CFG.token, password, client: { device } }));
      password = "";
    };
    sock.onmessage = (e) => {
      if (ws !== sock) return;
      let m = null;
      try {
        const b = typeof e.data === "string" ? null : new Uint8Array(e.data);
        m = b ? (b[0] === 0 ? JSON.parse(new TextDecoder().decode(b.subarray(1))) : null) : JSON.parse(e.data);
      } catch (_) {}
      if (m) onMessage(m);
    };
    sock.onclose = (e) => {
      if (ws !== sock) return;
      ws = null;
      if (!ready) { showLogin(lastErr || closeReason(e.code)); return; }
      ready = false;
      if (view && view.ended) view.ended(lastErr || (e.code === 1000 ? "" : closeReason(e.code)));
    };
  }

  function onMessage(m) {
    if (m.t === "err") lastErr = String(m.msg || "");
    else if (m.t === "term.ready") { ready = true; showScreen(m); }
    else if (!view || !view.write) return;
    else if (m.t === "term.out") view.write(String(m.d));
    else if (m.t === "term.note") view.note(String(m.d));
    else if (m.t === "term.exit") view.note("The shell exited" + (m.code != null && m.code !== 0 ? " (" + m.code + ")" : "") + ".");
  }
  const send = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

  // ---- the screen
  function showScreen(info) {
    const who = String(info.user || "") + "@" + String(info.host || "server");
    win.setTitle(who);
    body.innerHTML = '<div class="tm"><div class="tm-screen well"><pre class="tm-out"></pre>' +

// ---- where icons sit
// Each icon put somewhere has a spot in state.desk.pos ({x, y} in px within
// #icons). The rest take the first free grid cell, down each column and then
// across. With grid snap on, every icon sits on a cell, the nearest free one
// to where it was put; off, it stays exactly where it was dropped.
const CW = 96, CH = 108, IW = 84, IH = 100;
function grid() {
  const w = iconsEl.clientWidth, h = iconsEl.clientHeight;
  return { w, h, cols: Math.max(1, Math.floor((w - IW) / CW) + 1), rows: Math.max(1, Math.floor((h - IH) / CH) + 1) };
}
const cellAt = (p, g) => ({ c: clamp(Math.round(p.x / CW), 0, g.cols - 1), r: clamp(Math.round(p.y / CH), 0, g.rows - 1) });
function nearestFree(c, r, g, taken) {
  if (!taken.has(c + "," + r)) return { c, r };
  let best = null, bd = Infinity;
  for (let x = 0; x < g.cols; x++) for (let y = 0; y < g.rows; y++) {
    const d = (x - c) ** 2 + (y - r) ** 2;
    if (d < bd && !taken.has(x + "," + y)) { bd = d; best = { c: x, r: y }; }
  }
  return best || { c, r };
}
// Positions for keys, in order; skip leaves one icon out (it is being moved).
function layoutIcons(keys, skip) {
  const g = grid(), pos = state.desk.pos, out = new Map(), taken = new Set();
  const take = (k, c, r) => { taken.add(c + "," + r); out.set(k, { x: c * CW, y: r * CH }); };
  for (const k of keys) {
    if (k === skip || !Object.hasOwn(pos, k)) continue;
    const at = cellAt(pos[k], g);
    if (state.desk.snap) { const f = nearestFree(at.c, at.r, g, taken); take(k, f.c, f.r); }
    else {
      taken.add(at.c + "," + at.r);
      out.set(k, { x: clamp(pos[k].x, 0, Math.max(0, g.w - IW)), y: clamp(pos[k].y, 0, Math.max(0, g.h - IH)) });
    }
  }
  let next = 0;
  for (const k of keys) {
    if (k === skip || out.has(k)) continue;
    while (next < g.cols * g.rows && taken.has(Math.floor(next / g.rows) + "," + (next % g.rows))) next++;
    const n = Math.min(next, g.cols * g.rows - 1);
    take(k, Math.floor(n / g.rows), n % g.rows);
  }
  return { out, taken, g };
}

// Icons are dragged with the same drag and drop that moves files between

const spot = html('<div class="d-spot" hidden></div>');

function spotFor(e) {
  if (!dragIcon && !dragPath) return null;
  const t = e.target;
  if (!(t instanceof Element) || t.closest(".win, .panel, .scrim, .menu")) return null;
  const over = t.closest(".d-icon[data-path]");

  if (dragIcon) key = dragIcon.key;

  }

  const p = { x: e.clientX - r.left - dx, y: e.clientY - r.top - dy };

  if (state.desk.snap) { const at = cellAt(p, g), f = nearestFree(at.c, at.r, g, taken); return { key, x: f.c * CW, y: f.r * CH }; }
