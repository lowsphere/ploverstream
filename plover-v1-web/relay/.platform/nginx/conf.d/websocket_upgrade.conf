# Maps the Upgrade request header to the Connection header nginx must send
# upstream so a WebSocket handshake survives the proxy hop. Lives in the http
# context (conf.d is included there by the platform's nginx.conf).
#
# NOTE: if `eb deploy` fails to reload nginx with
#   "duplicate map ... $connection_upgrade"
# your platform version already defines this map -- delete this file and
# redeploy; 00_application.conf below still passes the headers.
map $http_upgrade $connection_upgrade {
    default "upgrade";
    ""      "";
}
